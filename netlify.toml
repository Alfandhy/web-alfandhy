# Netlify configuration for Astro static site
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 301 Redirects for Canonical Sandeq Rush URLs
[[redirects]]
  from = "/game/sandeqrush"
  to = "/game/sandeq-rush"
  status = 301
  force = true

[[redirects]]
  from = "/game/sandeqrush/privacy"
  to = "/game/sandeq-rush/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/en/game/sandeqrush"
  to = "/en/game/sandeq-rush"
  status = 301
  force = true

[[redirects]]
  from = "/en/game/sandeqrush/privacy"
  to = "/en/game/sandeq-rush/privacy"
  status = 301
  force = true

# Cache optimized Astro scripts and styles
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache videos and media assets
[[headers]]
  for = "/games/sandeq-rush/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Accept-Ranges = "bytes"

# Strict security headers for production static site
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
