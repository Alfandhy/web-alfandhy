# Netlify configuration for Astro static site
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache optimized Astro scripts and styles
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache videos and assets
[[headers]]
  for = "/games/sandeq-rush/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Accept-Ranges = "bytes"

# General security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
